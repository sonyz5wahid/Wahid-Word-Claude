plugins { id 'com.android.application' }

android {
    namespace 'id.wahid.word'
    compileSdk 34
    defaultConfig {
        applicationId "id.wahid.word"
        minSdk 17          // Android 4.2 Jelly Bean
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding "UTF-8"
    }
    lint { abortOnError false }
}
// Sengaja TANPA dependensi (tanpa AndroidX) agar kecil & kompatibel API 17.
